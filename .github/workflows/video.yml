name: video

# Graba el video de demo contra la app publicada, con narración de Workers AI (Aura 2), y lo deja como artefacto.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grabar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Voces ya generadas (rama demo-video)
        run: |
          mkdir -p video/out
          (git fetch -q --depth 1 origin demo-video && git archive FETCH_HEAD voces | tar -x -C video/out) || echo "Sin voces guardadas todavía"
      - name: Narración
        run: node video/narrar.mjs
      - name: Grabación
        run: node video/grabar.mjs https://cobra.peshino2012.workers.dev
      - name: Montaje
        run: node video/armar.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            video/out/cobra-demo.mp4
            video/out/hoja.png
            video/out/marcas.json
            video/out/duraciones.json
      # También si falla la grabación: así las voces ya pagadas con la cuota de Workers AI no se pierden.
      - name: Guardar en la rama demo-video
        if: always()
        run: |
          cd video/out
          [ -d voces ] || exit 0
          git init -q -b demo-video
          for f in cobra-demo.mp4 hoja.png marcas.json duraciones.json voces; do [ -e "$f" ] && git add "$f"; done
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Video de demo (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-video
