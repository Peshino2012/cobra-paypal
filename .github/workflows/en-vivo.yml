name: en-vivo

# Recorrido completo contra la app publicada (Workers AI y PayPal sandbox reales).
# A mano o una vez por semana: cada corrida gasta cuota diaria de Workers AI que es para los usuarios.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 3'

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node e2e/en-vivo.mjs https://cobra.peshino2012.workers.dev
