name: paypal-sandbox

# Prueba contra el sandbox REAL de PayPal con las credenciales del repo:
# crea un borrador de factura con el mismo código de la app, lo lee y lo borra.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * 1'

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Permisos que PayPal le da a la app
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        # PayPal reusa el token mientras no venza (hasta 9 h), con los permisos que la app tenía
        # cuando se emitió. Si le falta Invoicing, se termina ese token y se pide uno nuevo.
        run: |
          API=https://api-m.sandbox.paypal.com/v1/oauth2
          pedir() { curl -sS -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" -d grant_type=client_credentials "$API/token"; }
          resumen() { jq '{expires_in, app_id, invoicing: (.scope | contains("services/invoicing")), scopes: (.scope | split(" ") | map(sub("https://uri.paypal.com/services/"; "")))}'; }
          R=$(pedir); T=$(jq -r .access_token <<<"$R"); echo "::add-mask::$T"
          resumen <<<"$R"
          if ! jq -e '.scope | contains("services/invoicing")' <<<"$R" >/dev/null; then
            echo "Sin Invoicing: termino el token viejo y pido otro"
            curl -sS -o /dev/null -w 'terminate: %{http_code}\n' -u "$PAYPAL_CLIENT_ID:$PAYPAL_CLIENT_SECRET" \
              --data-urlencode "token=$T" -d token_type_hint=ACCESS_TOKEN "$API/token/terminate"
            R=$(pedir); echo "::add-mask::$(jq -r .access_token <<<"$R")"
            resumen <<<"$R"
          fi
      - name: Borrador real en el sandbox
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          node --input-type=module -e "
          import { crearPaypal } from './src/paypal.js';
          import { validarBorrador, payloadPaypal, filaDesdePaypal } from './src/facturas.js';
          const pp = crearPaypal({ clientId: process.env.PAYPAL_CLIENT_ID, secret: process.env.PAYPAL_CLIENT_SECRET });
          const { borrador } = validarBorrador({ cliente: 'Cobra CI', email: 'ci@example.com', items: [{ descripcion: 'Sandbox check', precio: 1 }] });
          const numero = await pp.siguienteNumero();
          const inv = await pp.crearBorrador(payloadPaypal(borrador, { numero }));
          const leida = await pp.obtener(inv.id);
          console.log(JSON.stringify(filaDesdePaypal(leida), null, 2));
          const token = await pp.obtenerToken();
          const r = await fetch('https://api-m.sandbox.paypal.com/v2/invoicing/invoices/' + inv.id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
          console.log('borrado:', r.status);
          if (leida.status !== 'DRAFT' || filaDesdePaypal(leida).cliente !== 'Cobra CI' || r.status !== 204) process.exit(1);
          "
